name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  npm_config_registry: https://registry.npmjs.org/
  npm_config_audit: "false"
  npm_config_fund: "false"
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  check:
    name: ${{ matrix.project }} checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [server, desktop]
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify release tag matches package versions
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        working-directory: ${{ github.workspace }}
        run: node scripts/verify-release-version.mjs

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Pin npm version
        run: npm install --global npm@12.2.0

      - name: Verify exact dependency versions and lockfiles
        run: node ../scripts/check-dependency-versions.mjs

      - name: Install locked dependencies
        run: npm ci --prefer-offline

      - name: Lint Server
        if: matrix.project == 'server'
        run: npx --no-install eslint "src/**/*.ts" "libs/**/*.ts" "test/**/*.ts"

      - name: Typecheck Desktop
        if: matrix.project == 'desktop'
        run: npm run typecheck

      - name: Run Server tests
        if: matrix.project == 'server'
        run: npm test -- --runInBand

      - name: Run Desktop tests
        if: matrix.project == 'desktop'
        run: npm test

      - name: Run Server E2E tests
        if: matrix.project == 'server'
        run: npm run test:e2e -- --runInBand

      - name: Build
        run: npm run build

  package:
    name: Package ${{ matrix.platform }}-${{ matrix.arch }}
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            command: npm run package:linux -- --publish never
          - os: windows-2022
            platform: win
            arch: x64
            command: npm run package:win -- --publish never
          - os: macos-15-intel
            platform: mac
            arch: x64
            command: npm run package -- --mac --x64 --publish never
          - os: macos-15
            platform: mac
            arch: arm64
            command: npm run package -- --mac --arm64 --publish never
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: ""
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            desktop/package-lock.json

      - name: Pin npm version
        run: npm install --global npm@12.2.0

      - name: Verify exact dependency versions and lockfiles
        run: node scripts/check-dependency-versions.mjs

      - name: Install Server dependencies
        working-directory: server
        run: npm ci --prefer-offline

      - name: Install Desktop dependencies
        working-directory: desktop
        run: npm ci --prefer-offline

      - name: Package Desktop
        working-directory: desktop
        run: ${{ matrix.command }}

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pugying-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop/release/*.exe
            desktop/release/*.deb
            desktop/release/*.rpm
            desktop/release/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: pugying-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "未找到安装包产物" >&2
            exit 1
          fi
          gh release create "${{ github.ref_name }}" "${files[@]}" \
            --title "蒲公英 ${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag
