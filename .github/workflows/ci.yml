name: CI

on:
  push:
    branches: [main]
    tags: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  npm_config_registry: https://registry.npmjs.org/
  npm_config_audit: "false"
  npm_config_fund: "false"
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  check:
    name: ${{ matrix.project }} checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [server, desktop]
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Pin npm version
        run: npm install --global npm@12.2.0

      - name: Verify exact dependency versions and lockfiles
        run: node ../scripts/check-dependency-versions.mjs

      - name: Install locked dependencies
        run: npm ci --prefer-offline

      - name: Lint Server
        if: matrix.project == 'server'
        run: npx --no-install eslint "src/**/*.ts" "libs/**/*.ts" "test/**/*.ts"

      - name: Typecheck Desktop
        if: matrix.project == 'desktop'
        run: npm run typecheck

      - name: Run Server tests
        if: matrix.project == 'server'
        run: npm test -- --runInBand

      - name: Run Desktop tests
        if: matrix.project == 'desktop'
        run: npm test

      - name: Run Server E2E tests
        if: matrix.project == 'server'
        run: npm run test:e2e -- --runInBand

      - name: Build
        run: npm run build

  package:
    name: Package ${{ matrix.platform }}-${{ matrix.arch }}
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            command: npm run package:linux -- --publish never
            directory: linux-unpacked
          - os: windows-2022
            platform: win
            arch: x64
            command: npm run package:win -- --publish never
            directory: win-unpacked
          - os: macos-15-intel
            platform: mac
            arch: x64
            command: npm run package -- --mac --x64 --publish never
            directory: mac
          - os: macos-15
            platform: mac
            arch: arm64
            command: npm run package -- --mac --arm64 --publish never
            directory: mac-arm64
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: ""
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            desktop/package-lock.json

      - name: Pin npm version
        run: npm install --global npm@12.2.0

      - name: Verify exact dependency versions and lockfiles
        run: node scripts/check-dependency-versions.mjs

      - name: Install Server dependencies
        working-directory: server
        run: npm ci --prefer-offline

      - name: Install Desktop dependencies
        working-directory: desktop
        run: npm ci --prefer-offline

      - name: Package Desktop
        working-directory: desktop
        run: ${{ matrix.command }}

      # 先打归档再上传，保留 Linux/macOS 的执行权限和符号链接。
      - name: Archive Linux or macOS application
        if: matrix.platform != 'win'
        env:
          PACKAGE_DIRECTORY: ${{ matrix.directory }}
          PACKAGE_NAME: pugying-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
        run: tar -czf "desktop/release/$PACKAGE_NAME" -C desktop/release "$PACKAGE_DIRECTORY"

      - name: Archive Windows application
        if: matrix.platform == 'win'
        shell: pwsh
        run: Compress-Archive -Path desktop/release/win-unpacked -DestinationPath desktop/release/pugying-win-x64.zip

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pugying-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: |
            desktop/release/*.tar.gz
            desktop/release/*.zip
            desktop/release/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
