# Pugying CI/CD
#
# CI（check 阶段）：backend / frontend / agent 三模块各自 lint + 测试 + 编译，
#   任一失败即阻断，确保仓库始终可正常编译与发布。
# CD（docker 阶段）：main 分支与 tag 上验证 Docker 镜像可构建；
#   若 GitLab 启用了 Container Registry 则自动推送。
#   实际部署方式（本机 pm2 / Docker Compose）见 DEPLOY.md。

stages:
  - check
  - docker

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

default:
  image: node:22-bookworm
  interruptible: true

variables:
  npm_config_cache: $CI_PROJECT_DIR/.npm
  npm_config_fund: "false"
  npm_config_audit: "false"

# ---------------- check ----------------

backend:check:
  stage: check
  cache:
    key:
      files:
        - backend/package-lock.json
    paths:
      - .npm
  script:
    - cd backend
    - npm ci --prefer-offline
    # lint 脚本带 --fix，CI 中只检查不修改
    - npx eslint "src/**/*.ts" "libs/**/*.ts" "test/**/*.ts"
    - npm run build
    - npm test
    - npm run test:e2e
  artifacts:
    name: pugying-backend-$CI_COMMIT_SHORT_SHA
    paths:
      - backend/dist
    expire_in: 1 week

frontend:check:
  stage: check
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm
  script:
    - cd frontend
    - npm ci --prefer-offline
    - npm run lint
    - npm test
    # build 含 tsc -b，等同类型检查
    - npm run build
  artifacts:
    name: pugying-frontend-$CI_COMMIT_SHORT_SHA
    paths:
      - frontend/dist
    expire_in: 1 week

agent:check:
  stage: check
  variables:
    # CI 只做编译与测试校验，不需要下载 Electron 运行时二进制
    ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  cache:
    key:
      files:
        - agent/package-lock.json
    paths:
      - .npm
  script:
    - cd agent
    - npm ci --prefer-offline
    - npm run typecheck
    - npm test
    - npm run build

# ---------------- docker ----------------
# 需要 runner 支持 docker（docker executor + privileged dind，
# 或 shell executor 自带 docker——后者可删除 image/services 两段）。

.docker-base:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: /certs
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - export IMAGE_TAG=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}
    - |
      if [ -n "${CI_REGISTRY:-}" ]; then
        echo "$CI_JOB_TOKEN" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      fi

docker:backend:
  extends: .docker-base
  script:
    - docker build -t pugying-backend:$IMAGE_TAG backend
    - |
      if [ -n "${CI_REGISTRY:-}" ]; then
        docker tag pugying-backend:$IMAGE_TAG $CI_REGISTRY_IMAGE/backend:$IMAGE_TAG
        docker tag pugying-backend:$IMAGE_TAG $CI_REGISTRY_IMAGE/backend:latest
        docker push $CI_REGISTRY_IMAGE/backend:$IMAGE_TAG
        docker push $CI_REGISTRY_IMAGE/backend:latest
      fi

docker:frontend:
  extends: .docker-base
  script:
    # 前端镜像的 API 地址为构建期注入（VITE_API_BASE_URL）。
    # CI 仅验证可构建；面向具体环境的镜像请在部署机用 docker compose build 生成。
    - docker build -t pugying-frontend:$IMAGE_TAG frontend
    - |
      if [ -n "${CI_REGISTRY:-}" ]; then
        docker tag pugying-frontend:$IMAGE_TAG $CI_REGISTRY_IMAGE/frontend:$IMAGE_TAG
        docker tag pugying-frontend:$IMAGE_TAG $CI_REGISTRY_IMAGE/frontend:latest
        docker push $CI_REGISTRY_IMAGE/frontend:$IMAGE_TAG
        docker push $CI_REGISTRY_IMAGE/frontend:latest
      fi
