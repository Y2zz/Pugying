# Pugying CI/CD
#
# CI（check 阶段）：server / desktop 各自测试与编译。
# desktop:dist:linux：electronuserland/builder 镜像打 Linux 目录包。
# Windows 含 better-sqlite3（Electron ABI），Docker/Wine 无 prebuild 时不可交叉编译，
# 故不在此打 win 包；请在 Windows 主机执行 npm run dist:win。

stages:
  - check
  - dist

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

default:
  # Nest 12 为 ESM；Jest 在 Node <24.9 无法 require(esm)，须与本机开发对齐
  image: node:24-bookworm
  interruptible: true

variables:
  npm_config_cache: $CI_PROJECT_DIR/.npm
  npm_config_fund: "false"
  npm_config_audit: "false"

# ---------------- check ----------------

server:check:
  stage: check
  cache:
    key:
      files:
        - server/package-lock.json
    paths:
      - .npm
  script:
    - cd server
    - npm ci --prefer-offline
    - npx eslint "src/**/*.ts" "libs/**/*.ts" "test/**/*.ts"
    - npm run build
    - npm test
    - npm run test:e2e
  artifacts:
    name: pugying-server-$CI_COMMIT_SHORT_SHA
    paths:
      - server/dist
    expire_in: 1 week

desktop:check:
  stage: check
  variables:
    ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  cache:
    key:
      files:
        - desktop/package-lock.json
    paths:
      - .npm
  script:
    - cd desktop
    - npm ci --prefer-offline
    - npm run typecheck
    - npm test
    - npm run build

# ---------------- dist ----------------

desktop:dist:linux:
  stage: dist
  image: electronuserland/builder:22-05.26
  needs:
    - job: desktop:check
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  cache:
    key:
      files:
        - desktop/package-lock.json
    paths:
      - .npm
      - .cache/electron
      - .cache/electron-builder
  variables:
    ELECTRON_CACHE: "$CI_PROJECT_DIR/.cache/electron"
    ELECTRON_BUILDER_CACHE: "$CI_PROJECT_DIR/.cache/electron-builder"
  script:
    - cd desktop
    - npm ci --prefer-offline
    - npm run dist:linux
  artifacts:
    name: pugying-desktop-linux-$CI_COMMIT_SHORT_SHA
    paths:
      - desktop/release/linux-unpacked/
    expire_in: 1 week
