# Pugying CI/CD
#
# CI（check 阶段）：server / desktop 各自测试与编译。
# 产品交付为桌面包；CI 不构建或推送独立 Server 镜像。

stages:
  - check

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

default:
  image: node:22-bookworm
  interruptible: true

variables:
  npm_config_cache: $CI_PROJECT_DIR/.npm
  npm_config_fund: "false"
  npm_config_audit: "false"

# ---------------- check ----------------

server:check:
  stage: check
  cache:
    key:
      files:
        - server/package-lock.json
    paths:
      - .npm
  script:
    - cd server
    - npm ci --prefer-offline
    - npx eslint "src/**/*.ts" "libs/**/*.ts" "test/**/*.ts"
    - npm run build
    - npm test
    - npm run test:e2e
  artifacts:
    name: pugying-server-$CI_COMMIT_SHORT_SHA
    paths:
      - server/dist
    expire_in: 1 week

desktop:check:
  stage: check
  variables:
    ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  cache:
    key:
      files:
        - desktop/package-lock.json
    paths:
      - .npm
  script:
    - cd desktop
    - npm ci --prefer-offline
    - npm run typecheck
    - npm test
    - npm run build
