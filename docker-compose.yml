# Pugying Docker 部署
# 用法：cp .env.example .env && 编辑 .env && docker compose up -d --build
services:
  backend:
    build: ./backend
    image: pugying-backend:local
    restart: unless-stopped
    environment:
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET（可用 openssl rand -hex 32 生成）}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    volumes:
      # sqlite 数据库持久化（容器内 /app/data/pugying.db）
      - pugying-data:/app/data
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        # 浏览器访问后端的地址（构建期注入）
        VITE_API_BASE_URL: ${API_BASE_URL:-http://localhost:3000}
    image: pugying-frontend:local
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  pugying-data:
